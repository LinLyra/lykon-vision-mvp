[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lykon-vision-mvp"
version = "0.1.0"
description = "Video-first basketball analytics and 3D reconstruction prototype for Lykon"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
